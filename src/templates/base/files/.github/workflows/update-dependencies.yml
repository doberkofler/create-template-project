name: update-dependencies

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

# [PM_SETUP]

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "{{packageManager}}"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm (required for trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: {{installCommand}}

      - name: Update dependencies
        run: {{updateCommand}}

      - name: Format
        run: {{packageManager}} run format

      - name: Lint, build and test
        run: {{packageManager}} run ci

      - name: Commit and push dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: update dependencies" --no-verify
            git push
          fi

      - name: Release
        run: {{packageManager}} exec release-it patch --ci --npm.publish --npm.skipChecks --no-hooks.before:init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
